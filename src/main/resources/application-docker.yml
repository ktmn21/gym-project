spring:
  datasource:
    url: jdbc:postgresql://gym-postgres:5432/gymcrm
    username: gym_user
    password: gym_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never
  activemq:
    broker-url: tcp://activemq:61616
    user: admin
    password: admin

logging:
  file:
    name: /app/logs/application.log
